  <!-- MÓDULOS DE AUTH -->
  <script type="module" src="./js/firebaseClient.js"></script>
  <script type="module">
    import { requireAuth, doLogout } from "./js/aut.js";

    // Protege a página: se não logado → login.html
    requireAuth("login.html", (user) => {
      const span = document.getElementById('userEmail');
      if (span) span.textContent = user.email || "Logado";

      const btnLogout = document.getElementById('btnLogout');
      btnLogout?.addEventListener('click', async () => {
        try { await doLogout("login.html"); } 
        catch(e){ alert("Não foi possível sair: " + e.message); }
      });
    });
  </script>
